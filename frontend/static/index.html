<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Agent</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --accent-light: #e0f2fe;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --user-bubble: #0284c7;
    --agent-bubble: #ffffff;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.03);
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.15rem;
    color: #0369a1;
  }
  .header-tagline {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .msg-row {
    display: flex;
    gap: 0.75rem;
    width: 100%;
    align-items: flex-start;
  }
  .msg-row.user {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .avatar.agent {
    background: var(--accent-light);
    color: #0284c7;
    border: 1px solid #bae6fd;
  }
  .avatar.user {
    background: #e2e8f0;
    color: #475569;
  }
  .bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .msg-row.user .bubble-wrap {
    align-items: flex-end;
  }
  .msg-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
    padding: 0 0.25rem;
  }
  .bubble {
    display: inline-block;
    padding: 0.75rem 1.05rem;
    border-radius: 16px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.5;
    box-shadow: var(--shadow);
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
  }
  .msg-row.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* Prompt chips bar */
  .suggestions-bar {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0.4rem 1rem;
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .chip-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 0.45rem 0.85rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease-in-out;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .chip-btn:hover {
    background: var(--accent-light);
    border-color: #38bdf8;
    color: #0369a1;
    transform: translateY(-1px);
  }

  .input-area {
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem 1rem 1rem;
  }
  form {
    display: flex;
    gap: 0.6rem;
    max-width: 820px;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 0.95rem;
    outline: none;
    background: #f8fafc;
    transition: border 0.15s ease;
  }
  input:focus {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }
  button.send-btn {
    padding: 0.8rem 1.3rem;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: background 0.15s ease;
  }
  button.send-btn:hover {
    background: var(--accent-hover);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; background: #ffffff; box-shadow: var(--shadow); max-width: 100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.45rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #1e293b; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #334155; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: #475569; }
  .a2text.a2-caption { font-size: 0.82rem; color: #64748b; }
  .a2divider { border: none; border-top: 1px solid #f1f5f9; margin: 0.45rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span style="font-size: 1.4rem;">☀️</span>
    <span>Weather Agent</span>
  </div>
  <div class="header-tagline">City Conditions, Travel Forecasts & Destinations</div>
</header>
<div id="log">
  <div class="msg-row agent">
    <div class="avatar agent">☀️</div>
    <div class="bubble-wrap">
      <div class="bubble">Hello! I'm your Weather & Travel Assistant. Ask me about live weather, city profiles, attractions, or let me generate travel postcards and calculate climate conversions.</div>
      <div class="msg-meta">Assistant</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="suggestions-bar">
    <button type="button" class="chip-btn" onclick="sendPrompt('What is the current weather in Tokyo and Paris?')">
      <span>🌦️</span> Check Live Weather
    </button>
    <button type="button" class="chip-btn" onclick="sendPrompt('Show me the city profile and climate details for San Francisco.')">
      <span>🏙️</span> City Climate & Details
    </button>
    <button type="button" class="chip-btn" onclick="sendPrompt('Generate a scenic postcard image of Mount Fuji with cherry blossoms.')">
      <span>🎨</span> Postcard Image Gen
    </button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask about weather, destinations, attractions…" autocomplete="off" autofocus>
    <button class="send-btn">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar " + who, who === "agent" ? "☀️" : "👤");
  const wrap = el("div", "bubble-wrap");
  const b = el("div", "bubble");
  const meta = el("div", "msg-meta", who === "agent" ? "Assistant" : "You");

  wrap.appendChild(b);
  wrap.appendChild(meta);
  row.appendChild(avatar);
  row.appendChild(wrap);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
